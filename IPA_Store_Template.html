
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>متجر IPA</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f9f9f9;
            margin: 0;
            padding: 0;
            text-align: right;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
        }
        .app {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 12px 20px;
            border-bottom: 1px solid #eee;
        }
        .app:last-child {
            border-bottom: none;
        }
        .app-info {
            display: flex;
            align-items: center;
        }
        .app-info img {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            margin-left: 15px;
        }
        .app-info div {
            display: flex;
            flex-direction: column;
        }
        .install-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }
        .category {
            margin-top: 30px;
            font-size: 1.2em;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>متجر IPA</h1>
        <p style="text-align:center;">قم بتثبيت التطبيقات مباشرة على جهازك iOS الخاص لا يلزم جيلبريك.</p>

        <div class="category">التطبيقات</div>
        <div class="app">
            <div class="app-info">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/52/Safari_browser_logo.svg/1200px-Safari_browser_logo.svg.png" alt="Safari">
                <div>
                    <strong>Safari</strong>
                    <span>تصفح</span>
                </div>
            </div>
            <a href="#" class="install-btn">تثبيت</a>
        </div>
        <div class="app">
            <div class="app-info">
                <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" alt="YouTube++">
                <div>
                    <strong>YouTube++</strong>
                    <span>الوسائط</span>
                </div>
            </div>
            <a href="#" class="install-btn">تثبيت</a>
        </div>
        <div class="app">
            <div class="app-info">
                <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram++">
                <div>
                    <strong>Instagram++</strong>
                    <span>الصور والفنبد</span>
                </div>
            </div>
            <a href="#" class="install-btn">تثبيت</a>
        </div>
        <div class="app">
            <div class="app-info">
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_%282019%29.png" alt="Facebook++">
                <div>
                    <strong>Facebook++</strong>
                    <span>الشبكات الاجتماعية</span>
                </div>
            </div>
            <a href="#" class="install-btn">تثبيت</a>
        </div>

        <div class="category">الألعاب</div>
        <div class="app">
            <div class="app-info">
                <img src="https://raw.githubusercontent.com/pwn20wndstuff/Undecimus/master/imgs/AltIcon.png" alt="unc0ver">
                <div>
                    <strong>unc0ver</strong>
                    <span>محاكة</span>
                </div>
            </div>
            <a href="#" class="install-btn">تثبيت</a>
        </div>
    </div>
</body>
</html>
